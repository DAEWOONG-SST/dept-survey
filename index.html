  .caption-bar{

  .caption-bar b{color:var(--navy);}
  main{padding:14px;}

  .section-band{

  .hint{font-size:11.5px; color:var(--muted); margin-top:5px;}

  .stat-card{
    background:#fbfcfe; border:1px solid var(--border); border-radius:12px; padding:12px 14px;

  .stat-card.wait .stat-value{color:#c3c9d4; font-weight:600; font-size:13px;}

  .placeholder{text-align:center; color:var(--muted); font-size:13px; padding:34px 10px;}

  .status-pill.same{background:#e6f4ea; color:#1e7a3d;}
  .status-pill.none{background:#eceff3; color:#8992a3;}

  "내분비대사내과",
  "순환기내과(심장내과)",
  "신장내과",
  "소화기내과",
  "호흡기내과",
  "알레르기내과",
  "류마티스내과",
  "혈액종양내과",
  "감염내과",
  "신경과",
  "신경외과",
  "정신건강의학과",
  "가정의학과",
  "정형외과",
  "이비인후과",
  "소아청소년과",
  "피부과",
  "비뇨의학과",
  "안과",
  "산부인과",
  "재활의학과",
  "마취통증의학과"
];

const SEQ_GROUPS = ["CEN", "GAD", "AMR", "AMR2", "AMR3"];
const GROUP_COLOR = {
  CEN:  { color: "var(--c-cen)",  bg: "var(--c-cen-bg)"  },
  GAD:  { color: "var(--c-gad)",  bg: "var(--c-gad-bg)"  },
  AMR:  { color: "var(--c-amr)",  bg: "var(--c-amr-bg)"  },
  AMR2: { color: "var(--c-amr2)", bg: "var(--c-amr2-bg)" },
  AMR3: { color: "var(--c-amr3)", bg: "var(--c-amr3-bg)" }
};

/* =========================================================================
   2) 제출 대상 Google Apps Script 웹앱 URL — 배포 후 여기에 넣으세요.
   ========================================================================= */
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7nq4jGPRYV_H-fpUivOEVDN0_LGBw4rFnw3_7r1YP28U0fdh8FZlN2Oj0rdsVCmMFWQ/exec";

/* ========================================================================= */

const buEl = document.getElementById('bu');
const officeEl = document.getElementById('office');
const clientInput = document.getElementById('clientInput');
const clientList = document.getElementById('clientList');
const bizNoCard = document.getElementById('bizNoCard');
const salesCodeCard = document.getElementById('salesCodeCard');
const bizNoVal = document.getElementById('bizNoVal');
const salesCodeVal = document.getElementById('salesCodeVal');
const seqContainer = document.getElementById('seqContainer');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const submitterEl = document.getElementById('submitter');

let selectedHospital = null;
let checkedDepts = {}; // { CEN: Set(...), GAD: Set(...), ... }

function uniq(arr){ return [...new Set(arr)]; }

function initBu(){
  uniq(HOSPITALS.map(h => h.bu)).sort().forEach(bu => {
    const opt = document.createElement('option');
    opt.value = bu; opt.textContent = bu;
    buEl.appendChild(opt);
  });
}

function resetClientArea(){
  selectedHospital = null;
  bizNoVal.textContent = "거래처 선택 후 표시";
  salesCodeVal.textContent = "거래처 선택 후 표시";
  bizNoCard.classList.add('wait'); salesCodeCard.classList.add('wait');
  seqContainer.innerHTML = '<div class="placeholder">거래처를 선택하면 시퀀스별 진료과 체크리스트가 표시됩니다.</div>';
  checkedDepts = {};
  updateSubmitState();
}

buEl.addEventListener('change', () => {
  officeEl.innerHTML = '';
  clientInput.value = ''; clientList.innerHTML = '';
  resetClientArea();

  if(!buEl.value){
    officeEl.disabled = true;
    officeEl.innerHTML = '<option value="">사업부를 먼저 선택하세요</option>';
    clientInput.disabled = true;
    clientInput.placeholder = "사무소를 먼저 선택하세요";
    return;
  }
  officeEl.disabled = false;
  const opt0 = document.createElement('option');
  opt0.value = ""; opt0.textContent = "선택하세요";
  officeEl.appendChild(opt0);
  uniq(HOSPITALS.filter(h => h.bu === buEl.value).map(h => h.office)).sort().forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    officeEl.appendChild(opt);
  });
  clientInput.disabled = true;
  clientInput.placeholder = "사무소를 먼저 선택하세요";
});

officeEl.addEventListener('change', () => {
  clientInput.value = '';
  resetClientArea();
  clientList.innerHTML = '';

  if(!officeEl.value){
    clientInput.disabled = true;
    clientInput.placeholder = "사무소를 먼저 선택하세요";
    return;
  }
  clientInput.disabled = false;
  clientInput.placeholder = "거래처명을 입력/선택하세요";
  HOSPITALS
    .filter(h => h.bu === buEl.value && h.office === officeEl.value)
    .forEach(h => {
      const opt = document.createElement('option');
      opt.value = h.name;
      clientList.appendChild(opt);
    });
});

clientInput.addEventListener('input', () => {
  const match = HOSPITALS.find(h =>
    h.bu === buEl.value && h.office === officeEl.value && h.name === clientInput.value.trim()
  );
  if(match){
    selectHospital(match);
  } else {
    resetClientArea();
  }
});

function selectHospital(h){
  selectedHospital = h;
  bizNoVal.textContent = h.bizNo || '-';
  salesCodeVal.textContent = h.salesCode || '-';
  bizNoCard.classList.remove('wait'); salesCodeCard.classList.remove('wait');
  checkedDepts = {};
  SEQ_GROUPS.forEach(g => checkedDepts[g] = new Set());
  renderSeqCards(h);
  updateSubmitState();
}

function statusPillFor(s){
  const dec = s.dec, jun = s.jun;
  if(!dec && !jun) return { cls: 'none', text: '미배정' };
  if(dec && jun && dec !== jun) return { cls: 'changed', text: '담당자 변경' };
  if(dec && jun && dec === jun) return { cls: 'same', text: '담당자 유지' };
  return { cls: 'changed', text: '신규 배정' };
}

function renderSeqCards(h){
  seqContainer.innerHTML = '';
  SEQ_GROUPS.forEach(group => {
    const s = h.seq[group];
    if(!s || !s.no) return;

    const gc = GROUP_COLOR[group];
    const hasManager = !!(s.dec || s.jun);
    const pill = statusPillFor(s);

    const card = document.createElement('div');
    card.className = 'seq-card' + (hasManager ? '' : ' empty');
    card.style.setProperty('--grp-color', gc.color);
    card.style.setProperty('--grp-bg', gc.bg);

    card.innerHTML = `
      <div class="seq-head">
        <span class="seq-title">${group}(${s.no})<span class="dept-count" data-role="count">0개 선택</span></span>
        <span class="status-pill ${pill.cls}">${pill.text}</span>
      </div>
      <div class="mgr-line">
        12월 담당자: <b>${s.dec || '미배정'}</b>
        <span class="mgr-arrow">→</span>
        6월(현재) 담당자: <b>${s.jun || '미배정'}</b>
      </div>
      <div class="dept-grid" data-group="${group}"></div>
    `;
    const grid = card.querySelector('.dept-grid');
    const countEl = card.querySelector('[data-role="count"]');
    DEPARTMENTS.forEach(dept => {
      const id = `dept-${group}-${dept}`.replace(/[^\w가-힣-]/g, '_');
      const item = document.createElement('label');
      item.className = 'dept-item';
      item.setAttribute('for', id);
      item.innerHTML = `<input type="checkbox" id="${id}" value="${dept}"><span>${dept}</span>`;
      const cb = item.querySelector('input');
      cb.addEventListener('change', () => {
        if(cb.checked){ checkedDepts[group].add(dept); item.classList.add('checked'); }
        else { checkedDepts[group].delete(dept); item.classList.remove('checked'); }
        countEl.textContent = checkedDepts[group].size + '개 선택';
        updateSubmitState();
      });
      grid.appendChild(item);
    });
    seqContainer.appendChild(card);
  });
}

function updateSubmitState(){
  const hasClient = !!selectedHospital;
  const hasAnyCheck = Object.values(checkedDepts).some(set => set && set.size > 0);
  submitBtn.disabled = !(hasClient && hasAnyCheck);
}

submitBtn.addEventListener('click', async () => {
  if(!selectedHospital) return;

  const rows = SEQ_GROUPS
    .map(group => {
      const s = selectedHospital.seq[group];
      const depts = [...(checkedDepts[group] || [])];
      if(!s || !s.no || depts.length === 0) return null;
      return {
        group, seq: s.no,
        mgrDec: s.dec || '', mgrJun: s.jun || '',
        departments: depts
      };
    })
    .filter(Boolean);

  if(rows.length === 0){
    statusEl.textContent = '진료과를 1개 이상 선택해주세요.';
    statusEl.className = 'err';
    return;
  }

  const payload = {
    submittedAt: new Date().toISOString(),
    submitter: submitterEl.value.trim(),
    businessUnit: selectedHospital.bu,
    office: selectedHospital.office,
    clientName: selectedHospital.name,
    bizNo: selectedHospital.bizNo,
    salesCode: selectedHospital.salesCode,
    rows
  };

  submitBtn.disabled = true;
  statusEl.textContent = '제출 중...';
  statusEl.className = '';

  try{
    if(GAS_WEB_APP_URL.includes('여기에_배포된_웹앱_ID를_넣으세요')){
      throw new Error('GAS_WEB_APP_URL이 아직 설정되지 않았습니다.');
    }
    // Apps Script 웹앱은 CORS 응답 헤더를 주지 않는 경우가 많아 no-cors로 전송합니다.
    // (응답 내용은 읽을 수 없지만, 네트워크 오류 없이 끝나면 서버에는 정상 도달합니다.)
    await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    statusEl.textContent = '제출이 완료되었습니다. 감사합니다!';
    statusEl.className = 'ok';
  } catch(err){
    statusEl.textContent = '제출 실패: ' + err.message;
    statusEl.className = 'err';
    submitBtn.disabled = false;
  }
});

initBu();
</script>
